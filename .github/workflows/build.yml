name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

env:
  LM_LICENSE_FILE: "${{ github.workspace }}/tools/cw/license.dat"
  BUILD: /var/tmp/pokeplatinum

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Install Software
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends bison flex g++ gcc-arm-none-eabi git make ninja-build pkg-config python3 wget xz-utils libpng-dev

      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Install Metroskrew
        run: sudo make skrew

      - name: Configure Repo
        run: make configure

      - name: Build Repo
        run: make check

      - name: Upload ROM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pokeplatinum-test-rom
          path: ${{ env.BUILD }}/pokeplatinum.us.nds
          if-no-files-found: error
          retention-days: 1

      - name: Post error archive
        if: failure()
        continue-on-error: true
        run: tar czf failure.tar.gz "$BUILD"

      - name: Post error upload
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pokeplatinum-failure-${{ github.run_id }}
          path: failure.tar.gz
          retention-days: 1
